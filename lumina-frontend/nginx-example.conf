# Server configuration: install as /etc/nginx/conf.d/default.conf.
# This is not a replacement for the top-level /etc/nginx/nginx.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        return 308 /api/$is_args$args;
    }

    location ^~ /api/ {
        # Preserved from the original configuration. Set this to YOUR backend.
        # No URI suffix: forward the original /api/... path and query unchanged.
        proxy_pass backend_domain_name;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Deliver SSE as it arrives, without response buffering or compression.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Accept-Encoding "";
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache" always;
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Do not replay AI tool invocations or replace API errors with HTML.
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }

    # Revalidate HTML so a new release does not reference stale asset names.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite build assets use content hashes; missing assets must return 404.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
