spring:
  application:
    name: lumina
  profiles:
    active: local  # 激活 local 配置，密钥密码等d敏感信息存在 application-local.yml 中，不提交该文件
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    dashscope:
      api-key: your_api_key_here
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
  datasource:
    url: jdbc:postgresql://your_host:your_port/your_database
    username: your_username
    password: your_password
  chat:
    options:
      model: qwq-plus
server:
  port: 8123
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yukina.lumina.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchApi
search-api:
  api-key: 你的 API Key

logging:
  level:
    org.springframework.ai: DEBUG

